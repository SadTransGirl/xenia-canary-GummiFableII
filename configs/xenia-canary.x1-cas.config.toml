[APU]
apu = "any"                                       	# Audio system. Use: [any, nop, sdl, xaudio2]
enable_xmp = true                                 	# Enables Music Player playback.
ffmpeg_verbose = false                            	# Verbose FFmpeg output (debug and above)
mute = false                                      	# Mutes all audio output.
use_dedicated_xma_thread = true                   	# Enables XMA decoding on separate thread. Disabled should produce better results, but decrease performance a bit.
xma_decoder = "new"                               	# Decoder version used to process XMA audio.
                                                  	# Use: [fake, master, old, new]
                                                  	#  fake: 
                                                  	#   No audio will be decoded.
                                                  	#  master: 
                                                  	#   Version of decoder exactly like on base version of Xenia.
                                                  	#  old: 
                                                  	#   Decoder based on master version of decoder with few improvements.
                                                  	#  new: 
                                                  	#   New version of decoder. Provides highest stability, but isn't yet finished.


[CPU]
break_condition_gpr = -1                          	# GPR compared to
break_condition_op = "eq"                         	# comparison operator
break_condition_truncate = true                   	# truncate value to 32-bits
break_condition_value = 0                         	# value compared against
break_on_debugbreak = true                        	# int3 on JITed __debugbreak requests.
break_on_instruction = 0                          	# int3 before the given guest address is executed.
break_on_start = false                            	# Break into the debugger on startup.
break_on_unimplemented_instructions = true        	# Break to the host debugger (or crash if no debugger attached) if an unimplemented PowerPC instruction is encountered.
clock_no_scaling = false                          	# Disable scaling code. Time management and locking is bypassed. Guest system time is directly pulled from host.
clock_source_raw = false                          	# On x64, Use the RDTSC instruction as the time source. Requires invariant TSC. On a64, Use the CNTVCT_EL0 register as the time source
cpu = "any"                                       	# Does nothing. CPU backend [any, x64].
cpu_starvation_mitigation = true                  	# Keep the game's logic thread running when the host CPU is busy with other demanding apps (e.g. another game open). Raises the emulator's process priority and makes guest clock-spin loops sleep so the starved thread gets CPU. Fixes characters/NPCs freezing while audio and the world keep running. Leave off unless you hit that freeze - it raises Xenia's priority over other apps.
debug_symbol_loader = false                       	# Enable dbghelp debug logging and validation.
debugprint_trap_log = false                       	# Log debugprint traps to the active debugger
disable_context_promotion = false                 	# Disables Context Promotion optimizations, this may be needed for some sports games, but will reduce performance.
disable_instruction_infocache = false             	# Disables caching records of called instructions/mmio accesses.
disable_prefetch_and_cachecontrol = true          	# Disables translating ppc prefetch/cache flush instructions to host prefetch/cacheflush instructions. This may improve performance as these instructions were written with the Xbox 360's cache in mind, and modern processors do their own automatic prefetching.
disassemble_functions = false                     	# Disassemble functions during generation.
dump_translated_hir_functions = false             	# dumps translated hir
elide_e0_check = true                             	# Eliminate e0 check on some memory accesses, like to r13(tls) or r1(sp)
emit_inline_mmio_checks = false                   	# Emit inline MMIO range checks for all I32 loads/stores instead of relying on exception-based MMIO detection.
emit_mmio_aware_stores_for_recorded_exception_addresses = true	# Uses info gathered via record_mmio_access_exceptions to emit special stores that are faster than trapping the exception
emit_source_annotations = false                   	# Add extra movs and nops to make disassembly easier to read.
enable_early_precompilation = false               	# Enable pre-compiling guest functions that we know we've called/that we've recognized as being functions via simple heuristics, good for error finding/stress testing with the JIT
full_optimization_even_with_debug = false         	# For developer use to analyze the quality of the generated code, not intended for actual debugging of the code
guard_indirect_call_targets = true                	# Skip an indirect guest call instead of crashing when its target isn't a plausible guest code address (below 0x10000 - real Xbox 360 code never lives there). Observed with Fable II: a combat callback dispatched through a degenerate/placeholder function pointer of 1, which dereferences as a read at host address 0x1 and hard-crashes the emulator. This converts that crash into a silently-skipped call. Negligible overhead (one compare+branch per indirect call). On by default.
ignore_trap_instructions = true                   	# Generate no code for powerpc trap instructions, can result in better performance in games that aggressively check with trap.
ignore_undefined_externs = true                   	# Don't exit when an undefined extern is called.
inline_loadclock = true                           	# Directly read cached guest clock without calling the LoadClock method (it gets repeatedly updated by calls from other threads)
inline_mmio_access = true                         	# Inline constant MMIO loads and stores.
load_module_map = ""                              	# Loads a .map for symbol names and to diff with the generated symbol database.
no_reserved_ops = false                           	# For testing whether a game may have races with a broken reserved load/store impl
no_round_to_single = false                        	# Not for users, breaks games. Skip rounding double values to single precision and back
permit_float_constant_evaluation = false          	# Allow float constant evaluation, may produce incorrect results and break games math
pvr = 7407360                                     	# Known PVR's.
                                                  	#  0x710200 = Used by Zephyr 
                                                  	#  0x710300 = Used by Zephyr
                                                  	#  0x710500 = Used by Jasper
                                                  	#  0x710700 = Default
                                                  	#  0x710800 = Used by Corona V1 & V2
                                                  	# Processor version and revision number.
                                                  	# Bits 0 to 15 are the version number.
                                                  	# Bits 16 to 31 are the revision number.
                                                  	# Note: Some XEXs (such as mfgbootlauncher.xex) may check for a value that's less than 0x710700.

record_mmio_access_exceptions = true              	# For guest addresses records whether we caught any mmio accesses for them. This info can then be used on a subsequent run to instruct the recompiler to emit checks
store_all_context_values = false                  	# Don't strip dead context stores to aid in debugging.
trace_function_coverage = false                   	# Generate tracing for function instruction coverage statistics.
trace_function_data = false                       	# Generate tracing for function result data.
trace_function_data_path = ""                     	# File to write trace data to.
trace_function_references = false                 	# Generate tracing for function address references.
trace_functions = false                           	# Generate tracing for function statistics.
use_fast_dot_product = false                      	# Experimental optimization, much shorter sequence on dot products, treating inf as overflow instead of using mcxsrfour insn dotprod
validate_hir = false                              	# Perform validation checks on the HIR during compilation.
writable_code_segments = false                    	# Enables a program to write to its own code segments in memory.


[Config]
defaults_date = 2026040912                        	# Do not modify - internal version of the default values in the config, for seamless updates if default value of any option is changed.


[Content]
license_mask = 0                                  	# Set license mask for activated content.
                                                  	#  0 = No licenses enabled.
                                                  	#  1 = First license enabled. Generally the full version license in
                                                  	#      Xbox Live Arcade titles.
                                                  	#  -1 or 0xFFFFFFFF = All possible licenses enabled. Generally a
                                                  	#                     bad idea, could lead to undefined behavior.


[D3D12]
d3d12_adapter = -1                                	# Index of the DXGI adapter to use. -1 for any physical adapter, -2 for WARP software rendering.
d3d12_allow_variable_refresh_rate_and_tearing = true	# In fullscreen, allow using variable refresh rate on displays supporting it. On displays not supporting VRR, screen tearing may occur in certain cases.
d3d12_bindless = true                             	# Use bindless resources where available - may improve performance, but may make debugging more complicated.
d3d12_break_on_error = false                      	# Break on Direct3D 12 validation errors.
d3d12_break_on_warning = false                    	# Break on Direct3D 12 validation warnings.
d3d12_debug = false                               	# Enable Direct3D 12 and DXGI debug layer.
d3d12_dxbc_disasm = false                         	# Disassemble DXBC shaders after generation.
d3d12_dxbc_disasm_dxilconv = false                	# Disassemble DXBC shaders after conversion to DXIL, if DXIL shaders are supported by the OS, and DirectX Shader Compiler DLLs available at https://github.com/microsoft/DirectXShaderCompiler/releases are present.
d3d12_pipeline_creation_threads = 0              	# Number of threads used for graphics pipeline creation. -1 to calculate automatically (75% of logical CPU cores), a positive number to specify the number of threads explicitly (up to the number of logical CPU cores), 0 to disable multithreaded pipeline creation.
d3d12_queue_priority = 1                          	# Graphics (direct) command queue scheduling priority, 0 - normal, 1 - high, 2 - global realtime (requires administrator privileges, may impact system responsibility)
d3d12_submit_on_primary_buffer_end = true         	# Submit the command list when a PM4 primary buffer ends if it's possible to submit immediately to try to reduce frame latency.
d3d12_tessellation_wireframe = false              	# Display tessellated surfaces as wireframe for debugging.


[Display]
fullscreen = true                                 	# Whether to launch the emulator in fullscreen.
host_present_from_non_ui_thread = true            	# Allow the GPU emulation thread to present the guest output to the host surface directly instead of requesting the UI thread to do so through the host window system.
postprocess_antialiasing = "fxaa"                 	# Post-processing anti-aliasing effect to apply to the image output of the game.
                                                  	# Using post-process anti-aliasing is heavily recommended when AMD FidelityFX Contrast Adaptive Sharpening or Super Resolution 1.0 is active.
                                                  	# Use: [none, fxaa, fxaa_extreme]
                                                  	#  none (or any value not listed here):
                                                  	#   Don't alter the original image.
                                                  	#  fxaa:
                                                  	#   NVIDIA Fast Approximate Anti-Aliasing 3.11, normal quality preset (12).
                                                  	#  fxaa_extreme:
                                                  	#   NVIDIA Fast Approximate Anti-Aliasing 3.11, extreme quality preset (39).

postprocess_dither = true                         	# Dither the final image output from the internal precision to 8 bits per channel so gradients are smoother.
                                                  	# On a 10bpc display, the lower 2 bits will still be kept, but noise will be added to them - disabling may be recommended for 10bpc, but it depends on the 10bpc displaying capabilities of the actual display used.

postprocess_ffx_cas_additional_sharpness = 0      	# Additional sharpness for AMD FidelityFX Contrast Adaptive Sharpening (CAS), from 0 to 1.
                                                  	# Higher is sharper.

postprocess_ffx_fsr_max_upsampling_passes = 4     	# Maximum number of upsampling passes performed in AMD FidelityFX Super Resolution 1.0 (FSR) before falling back to bilinear stretching after the final pass.
                                                  	# Each pass upscales only to up to 2x2 the previous size. If the game outputs a 1280x720 image, 1 pass will upscale it to up to 2560x1440 (below 4K), after 2 passes it will be upscaled to a maximum of 5120x2880 (including 3840x2160 for 4K), and so on.
                                                  	# This variable has no effect if the display resolution isn't very high, but may be reduced on resolutions like 4K or 8K in case the performance impact of multiple FSR upsampling passes is too high, or if softer edges are desired.
                                                  	# The default value is the maximum internally supported by Xenia.

postprocess_ffx_fsr_sharpness_reduction = 0.20000000298023224	# Sharpness reduction for AMD FidelityFX Super Resolution 1.0 (FSR), in stops.
                                                  	# Lower is sharper.

postprocess_scaling_and_sharpening = "cas"        	# Post-processing effect to use for resampling and/or sharpening of the final display output.
                                                  	# Use: [bilinear, cas, fsr]
                                                  	#  bilinear (or any value not listed here):
                                                  	#   Original image at 1:1, simple bilinear stretching for resampling.
                                                  	#  cas:
                                                  	#   Use AMD FidelityFX Contrast Adaptive Sharpening (CAS) for sharpening at scaling factors of up to 2x2, with additional bilinear stretching for larger factors.
                                                  	#  fsr:
                                                  	#   Use AMD FidelityFX Super Resolution 1.0 (FSR) for highest-quality upscaling, or AMD FidelityFX Contrast Adaptive Sharpening for sharpening while not scaling or downsampling.
                                                  	#   For scaling by factors of more than 2x2, multiple FSR passes are done.

present_letterbox = true                          	# Maintain aspect ratio when stretching by displaying bars around the image when there's no more overscan area to crop out.
present_render_pass_clear = true                  	# On graphics backends where this is supported, use the clear render pass load operation in presentation instead of clear commands clearing only the letterbox area.
present_safe_area_x = 100                         	# Percentage of the image width that can be kept when presenting to maintain aspect ratio without letterboxing or stretching.
present_safe_area_y = 100                         	# Percentage of the image height that can be kept when presenting to maintain aspect ratio without letterboxing or stretching.


[GPU]
anisotropic_override = -1                         	# Forces anisotropic filtering (AF) for eligible textures.
                                                  	# Higher values keep textures sharper at oblique angles at the cost of GPU bandwidth, though most GPUs handle up to 16x fine.
                                                  	# In rare cases, forcing AF can introduce visual artifacts.
                                                  	#  -1 = No override
                                                  	#   0 = Disable anisotropic filtering
                                                  	#   1 = Force 1x anisotropic filtering
                                                  	#   2 = Force 2x anisotropic filtering
                                                  	#   3 = Force 4x anisotropic filtering
                                                  	#   4 = Force 8x anisotropic filtering
                                                  	#   5 = Force 16x anisotropic filtering

async_shader_compilation = true                   	# Compile shaders and create pipelines asynchronously in background threads. Eliminates shader compilation stutter but may cause brief rendering artifacts while pipelines are being created. When disabled, pipelines are created synchronously which causes stutter but no visual artifacts.
clear_memory_page_state = false                   	# Refresh state of memory pages to enable gpu written data. (Use for 'Team Ninja' Games to fix missing character models)
debug_skip_ps_hash = "04985A0F7296E130"           	# Debug: like debug_skip_vs_hash, but matches the PIXEL shader ucode hash instead. Useful when multiple pixel shaders share one vertex shader (e.g. a simple screen-quad transform reused for several sprite layers) and only one of them needs to be isolated. Comma-separated 16-hex-digit hashes. For debugging only.
debug_skip_vs_hash = "7C5710DEF3EE33C4"	# Debug: skip (don't draw) any draw whose vertex shader ucode hash matches this 16-hex-digit value (e.g. 29B6506FBACEB93A). Used to visually isolate which draw produces an artifact - if the artifact disappears when a hash is skipped, that draw is the culprit. Empty = skip nothing. Multiple hashes may be given separated by commas. For debugging only.
depth_float24_convert_in_pixel_shader = false     	# Whether to convert the depth values to 24-bit floating-point (20e4) from the host precision (32-bit floating point) directly in the pixel shaders of guest draws when using a host depth buffer.
                                                  	# This prevents visual artifacts (interleaved stripes of parts of surfaces rendered and parts not rendered, having either the same width in case of the "greater or equal" depth test function, or the former being much thinner than the latter with the "equal" function) if the full host precision depth data is lost.
                                                  	# This issue may happen if the game reloads the depth data previously evicted from the EDRAM to the RAM back to the EDRAM, but the EDRAM region that previously contained that depth buffer was overwritten by another depth buffer, or the game loads it to a different location in the EDRAM than it was previously placed at, thus Xenia is unable to restore the depth data with the original precision, and instead falls back to converting the lower-precision values, so in subsequent rendering passes for the same geometry, the actual depth values of the surfaces don't match those stored in the depth buffer anymore.
                                                  	# This is a costly option because it makes the GPU unable to use depth buffer compression, and also with MSAA, forces the pixel shader to run for every subpixel sample rather than for the entire pixel, making pixel shading 2 or 4 times heavier depending on the MSAA sample count.
                                                  	# The rounding direction is controlled by the depth_float24_round configuration variable.
                                                  	# Note that with depth_float24_round = true, this becomes even more costly because pixel shaders must be executed regardless of whether the surface is behind the previously drawn surfaces. With depth_float24_round = false, conservative depth output is used, however, so depth rejection before the pixel shader may still work.
                                                  	# If sample-rate shading is not supported by the host GPU, the conversion in the pixel shader is done only when MSAA is not used.
                                                  	# When the depth buffer is emulated in software (via the fragment shader interlock / rasterizer-ordered view), this is ignored because 24-bit depth is always used directly.

depth_float24_round = false                       	# Whether to round to the nearest even, rather than truncating (rounding towards zero), the depth when converting it to 24-bit floating-point (20e4) from the host precision (32-bit floating point) when using a host depth buffer.
                                                  	# false:
                                                  	#  Recommended.
                                                  	#  The conversion may move the depth values farther away from the camera.
                                                  	#  Without depth_float24_convert_in_pixel_shader:
                                                  	#   The "greater or equal" depth test function continues to work fine if the full host precision depth data is lost, it's still possible to draw another pass of the same geometry with it.
                                                  	#   (See the description of depth_float24_convert_in_pixel_shader for more information about full precision depth data loss.)
                                                  	#  With depth_float24_convert_in_pixel_shader:
                                                  	#   Faster - the pixel shader for hidden surfaces may still be skipped (using conservative depth output).
                                                  	# true:
                                                  	#  Only for special cases of issues caused by minor 32-bit floating-point rounding errors, for instance, when the game tries to draw something at the camera plane by setting Z of the vertex position to W.
                                                  	#  The conversion may move the depth values closer or farther.
                                                  	#  Using the same rounding mode as in the Direct3D 9 reference rasterizer.
                                                  	#  Without depth_float24_convert_in_pixel_shader:
                                                  	#   Not possible to recover from a full host precision depth data loss - in subsequent passes of rendering the same geometry, half of the samples will be failing the depth test with the "greater or equal" depth test function.
                                                  	#  With depth_float24_convert_in_pixel_shader:
                                                  	#   Slower - depth rejection before the pixel shader is not possible.
                                                  	# When the depth buffer is emulated in software (via the fragment shader interlock / rasterizer-ordered view), this is ignored, and rounding to the nearest even is always done.

depth_transfer_not_equal_test = true              	# When transferring data between depth render targets, use the "not equal" test to avoid writing rewriting depth via shader depth output if it's the same as the one currently in the depth buffer in case of round trips of the data.
                                                  	# Settings this to true may make transfer round trips more friendly to depth compression depending on how the GPU implements it (as arbitrary depth output may result in it being disabled completely), which is beneficial to subsequent rendering, while setting this to false may reduce bandwidth usage during transfers as the previous depth won't need to be read.

disassemble_pm4 = false                           	# Only does anything in debug builds, if set will disassemble and log all PM4 packets sent to the CP.
draw_resolution_scale_x = 1                       	# Integer pixel width scale used for scaling the rendering resolution opaquely to the game.
                                                  	# Values from 1 to 7 may be supported, depending on device capabilities. Requires sparse binding (Vulkan) or tiled resources (D3D12) for scales above 1x1. The emulator will automatically clamp to the maximum supported scale if the requested value exceeds device limits.
                                                  	# Various effects and parts of game rendering pipelines may work incorrectly as pixels become ambiguous from the game's perspective and because half-pixel offset (which normally doesn't affect coverage when MSAA isn't used) becomes full-pixel.

draw_resolution_scale_y = 1                       	# Integer pixel width scale used for scaling the rendering resolution opaquely to the game.
                                                  	# See draw_resolution_scale_x for more information.

draw_resolution_scaled_texture_offsets = true     	# Apply offsets from texture fetch instructions taking resolution scale into account for render-to-texture, for more correct shadow filtering, bloom, etc., in some cases.
dump_shaders = ""                                 	# For shader debugging, path to dump GPU shaders to as they are compiled.
dxbc_source_map = false                           	# Disassemble Xenos instructions as comments in the resulting DXBC for debugging.
dxbc_switch = true                                	# Use switch rather than if for flow control. Turning this off or on may improve stability, though this heavily depends on the driver - on AMD, it's recommended to have this set to true, as some titles appear to crash when if is used for flow control (possibly the shader compiler tries to flatten them). On Intel HD Graphics, this is ignored because of a crash with the switch instruction.
execute_unclipped_draw_vs_on_cpu = true           	# Execute the vertex shader for draws with clipping disabled, primarily screen-space draws (such as clears), on the CPU when possible to estimate the extent of the EDRAM involved in the draw.
                                                  	# Enabling this may significantly improve GPU performance as otherwise up to the entire EDRAM may be considered used in draws without clipping, potentially resulting in spurious EDRAM range ownership transfer round trips between host render targets.
                                                  	# Also, on hosts where certain render target formats have to be emulated in a lossy way (for instance, 16-bit fixed-point via 16-bit floating-point), this prevents corruption of other render targets located after the current ones in the EDRAM by lossy range ownership transfers done for those draws.

execute_unclipped_draw_vs_on_cpu_for_psi_render_backend = true	# If execute_unclipped_draw_vs_on_cpu is enabled, execute the vertex shader for unclipped draws on the CPU even when using the pixel shader interlock (rasterizer-ordered view) implementation of the render backend on the host, for which no expensive copying between host render targets is needed when the ownership of a EDRAM range is changed.
                                                  	# If this is enabled, excessive barriers may be eliminated when switching between different render targets in separate EDRAM locations.

execute_unclipped_draw_vs_on_cpu_with_scissor = false	# Don't restrict the usage of execute_unclipped_draw_vs_on_cpu to only non-scissored draws (with the right and the bottom sides of the scissor rectangle at 8192 or beyond) even though if the scissor rectangle is present, it's usually sufficient for esimating the height of the render target.
                                                  	# Enabling this may cause excessive processing of vertices on the CPU, as some games draw rectangles (for their UI, for instance) without clipping, but with a proper scissor rectangle.

force_convert_line_loops_to_strips = false        	# For host graphics API downlevel support testing only, force CPU conversion of line loops to line strips even if the host supports line loop primitives natively.
force_convert_quad_lists_to_triangle_lists = false	# For host graphics API downlevel support testing only, force CPU conversion of quad lists to quad strips even if the host supports quad list primitives natively or via geometry shader emulation.
                                                  	# May also be useful for graphics debugging when the debugger doesn't display the geometry generated by geometry shaders properly.

force_convert_triangle_fans_to_lists = false      	# For host graphics API downlevel support testing only, force CPU conversion of triangle fans to triangle lists even if the host supports triangle fan primitives natively.
framerate_limit = 165                             	# Maximum frames per second. 0 = Unlimited frames.
                                                  	# Defaults to 60, when set to 0, and VSYNC is enabled.

gamma_decode_pwl_resolve = true                   	# During 8_8_8_8_GAMMA MSAA color resolves, average the samples in linear space instead of averaging the encoded PWL gamma values directly.
                                                  	# This is separate from gamma_render_target_as_unorm16. It only applies when a full shader resolve reads an 8_8_8_8_GAMMA EDRAM color source. Compatible 8_8_8_8 destinations are written back as PWL gamma.
                                                  	# Leave enabled for games that otherwise look overexposed after gamma MSAA resolves. Disable only if it causes a title-specific regression.

gamma_render_target_as_unorm16 = false            	# When the host can't write 8 bits per component pixels with piecewise linear gamma encoding directly with correct blending, use the 16-bit unsigned normalized format, if supported, for conceptually correct 8_8_8_8_GAMMA render target format blending in linear color space. Greatly increases accuracy for this format, but may result in render target copying costs if the game switches between 8_8_8_8_GAMMA and 8_8_8_8 views for the same EDRAM render target.
gpu = ""                                          	# Graphics system. Use: [any, d3d12, vulkan, null]
gpu_3d_to_2d_texture = true                       	# Handle shaders that sample 3D textures as 2D by creating a 2D texture from slice 0 of the guest memory.
gpu_allow_invalid_fetch_constants = true          	# Allow texture and vertex fetch constants with invalid type - generally unsafe because the constant may contain completely invalid values, but may be used to bypass fetch constant type errors in certain games until the real reason why they're invalid is found.
gpu_allow_invalid_upload_range = false            	# Allows games to read data from pages that are marked as no access.
gpu_clamp_fp10_edram_output = true                	# On the host-render-target (RTV) path, clamp pixel shader color output for k_2_10_10_10_FLOAT (7e3) render targets to the console-representable range ([0, 31.875] RGB, [0, 1] alpha). The float16 host resource backing an FP10 target does not clamp to the 7e3 range the way console EDRAM / the ROV path does, so bright additive HDR content can accumulate past 31.875 and blow out after the game's tonemap (Fable II moon halo hard-disc bug). Runtime-toggleable (system-constant flag, no shader-cache clear). Experimental; off by default.
gpu_flush_nonfinite_vertex = false                	# Replace any non-finite (NaN/Inf) vertex shader output position with the clip-space origin. Superseded by gpu_flush_nonfinite_vertex_fetch (which fixes the bad input instead of collapsing the output, avoiding stray triangles); leave this off. Off by default.
gpu_flush_nonfinite_vertex_fetch = false          	# Sanitize non-finite (NaN/Inf) components of fetched float vertex attributes. Mitigation for meshes fed bad CPU-supplied float data - e.g. Fable II's dog, whose bone matrices intermittently contain an Inf column. For the 4x4-float transform format the corrupt component is replaced with the identity-matrix value for that row/column (so an Inf Y-column becomes a unit Y axis and the matrix stays non-degenerate - the affected bone just doesn't apply its bad transform); other float formats are flushed to 0. The dog then renders finite and flicker-free instead of exploding. Does not fix the underlying bad data (a CPU-side issue). Changes shader codegen - clear the shader cache (or let shaders retranslate) after toggling. Off by default.
gpu_sanitize_nonfinite_constants = false          	# Replace non-finite (NaN/Inf) float shader constants with 0 when uploading them to the GPU. Mitigation for effects fed a bad CPU-computed constant - e.g. Fable II's translucent 'moon lighting' sheets, whose pixel shader reads c47.x = +Inf on ~15% of frames and blows up its shading. Only touches values that are already non-finite, so legitimate constants are untouched. Does not fix the underlying bad data (a CPU-side issue). Off by default.
half_pixel_offset = true                          	# Enable support of vertex half-pixel offset (D3D9 PA_SU_VTX_CNTL PIX_CENTER). Generally games are aware of the half-pixel offset, and having this enabled is the correct behavior (disabling this may significantly break post-processing in some games), but in certain games it might have been ignored, resulting in slight blurriness of UI textures, for instance, when they are read between texels rather than at texel centers, or the leftmost/topmost pixels may not be fully covered when MSAA is used with fullscreen passes.
ignore_32bit_vertex_index_support = false         	# For host graphics API downlevel testing only (useful only for Qualcomm Adreno 4xx-level host GPU testing), force indirection or pre-masking and pre-swapping of 32-bit vertex indices as if the host only supports 24-bit indices.
log_additive_draws = false                        	# Log the VS/PS hashes of every translucent draw using additive-style blending (dest factor One/InvSrcAlpha with src One/SrcAlpha), deduped per shader pair. Glow/halo effects (e.g. Fable II's moon halo) are almost always additive, unlike ordinary alpha-blended world geometry - this narrows a large translucent-draw candidate list down to just the effect layer. For debugging only.
log_fp10_resolve_clamp = false                    	# Log every resolve of a k_2_10_10_10_FLOAT (FP10, [0,32) HDR) EDRAM render target to a texture, with the destination copy format and address. The destination format enum has no float variant, so this resolve always hard-clamps HDR values above 1.0 via a plain UNORM saturate - used to confirm whether Fable II's moon halo draws into an FP10 target that gets resolved this way. For debugging only.
log_gamma_ramp_writes = false                     	# Log the range of DC_LUT_30_COLOR/DC_LUT_SEQ_COLOR gamma ramp indices the guest actually writes to (once, on the first write, and again whenever a new high-water-mark index is reached). Diagnostic for gamma-ramp-related visual corruption - shows whether the guest ever writes the full 0-255 range or stops partway through.
log_guest_driven_gpu_register_written_values = false	# Only does anything in debug builds, if set will log every write to a gpu register done by a guest. Does not log writes that are done by the CP on its own, just ones the guest makes or instructs it to make.
log_halo_texture_fetch = false                    	# Log the tf13 texture fetch constant (address, size, format, mip levels, and U/V/W clamp/address modes) for the Fable II moon halo pixel shader 04985A0F7296E130 each time the bound texture or clamp mode changes. Used to check whether the glow sprite is sampled with Wrap addressing (which tiles/seams at the sprite edges) or served the wrong texture. For debugging only. Off by default.
log_memexport_ranges = false                      	# Log GPU memory export (memexport) stream ranges and skip reasons for diagnosing memexport-driven geometry corruption.
log_nonfinite_constants = false                   	# Log any draw whose USED float shader constants contain a non-finite (NaN/Inf) or absurdly huge (|value| >= 1e6) value, with the vertex and pixel shader hashes and the offending constant register/component. Diagnostic for geometry that stretches/explodes because of a bad transform or light-position CONSTANT (as opposed to bad vertex data, which log_nonfinite_draws covers) - e.g. Fable II's flickering translucent 'moon lighting' sheets. Very verbose; for debugging only. Off by default.
log_nonfinite_draws = false                       	# Log a draw whose guest vertex data contains a non-finite (NaN/Inf) value in its first vertices/instances - identifies meshes that explode because the game's CPU-supplied transform data is bad (e.g. Fable II's dog). Logs the vertex shader hash and binding so the offending draw can be pinpointed.
log_ps_c31_writes = false                         	# Log every guest write to pixel shader float constant register c31 (value + component), and the value actually copied into the GPU constant buffer whenever a draw's pixel shader uses c31. Used to determine whether Fable II's moon halo hard-edge bug is caused by the guest CPU computing a wrong tint value for c31, or by Xenia serving a stale cached upload. Very verbose; for debugging only. Off by default.
log_resolve_readback = false                      	# Log every render-to-texture resolve that is a candidate for CPU readback (address, length, color/depth source, destination format, and whether readback was actually performed). Diagnostic for textures that read back incorrectly - compare the lines for a working vs. a broken object.
log_ringbuffer_kickoff_initiator_bts = false      	# Only does anything in debug builds, if set will log the pseudo-stacktrace of the guest thread that wrote the new read position.
log_vertex_fetch_constants = false                	# Log per-draw vertex fetch constants (base address, endianness, stride, attribute formats) for diagnosing geometry corruption, especially memexport-skinned meshes. Noisy; logs every draw.
mrt_edram_used_range_clamp_to_min = true          	# With host render targets, if multiple render targets are bound, estimate the EDRAM range modified in any of them to be not bigger than the distance between any two render targets in the EDRAM, rather than allowing the last one claim the rest of the EDRAM.
                                                  	# Has effect primarily on draws without viewport clipping.
                                                  	# Setting this to false results in higher accuracy in rare cases, but may increase the amount of copying that needs to be done sometimes.

native_2x_msaa = true                             	# Use host 2x MSAA when available. Can be disabled for scalability testing on host GPU APIs where 2x is not mandatory, in this case, 2 samples of 4x MSAA will be used instead (with similar or worse quality and higher memory usage).
native_stencil_value_output = true                	# Use pixel shader stencil reference output where available for purposes like copying between render targets. Can be disabled for scalability testing, in this case, much more expensive drawing of 8 quads will be done.
native_stencil_value_output_d3d12_intel = false   	# Allow stencil reference output usage on Direct3D 12 on Intel GPUs - not working on UHD Graphics 630 as of March 2021 (driver 27.20.0100.8336).
no_discard_stencil_in_transfer_pipelines = false  	# Skip stencil bit discard in render target transfer pipelines. May improve performance on some GPUs.
non_seamless_cube_map = true                      	# Disable filtering between cube map faces near edges where possible (Vulkan with VK_EXT_non_seamless_cube_map) to reproduce the Direct3D 9 behavior.
occlusion_query = "fast"                          	# Controls hardware occlusion query behavior for EVENT_WRITE_ZPD.
                                                  	# Used for effects like lens flares, object culling, and auto-exposure.
                                                  	#  fake: Write a fake result without asking the GPU. Safe for most games,
                                                  	#        though some effects may look slightly wrong.
                                                  	#  fast: Ask the GPU but don't wait for the answer. Writes a cached
                                                  	#        result immediately and updates it when the GPU catches up.
                                                  	#        Cached results bias toward visible when guessing. (default)
                                                  	#  fast-alt: Variant of fast mode that keeps cached zero results for
                                                  	#            unresolved reports. May improve effects relying on precise
                                                  	#            visibility, but may be less stable for occlusion culling.
                                                  	#  strict: Ask the GPU and wait for the real result before continuing.
                                                  	#          Most accurate, but may be somewhat less performant.

occlusion_query_fake_lower_threshold = 80         	# Lower end of the fake sample count value written on EVENT_WRITE_ZPD when real occlusion queries are disabled.
                                                  	# -1 writes nothing, resulting in some games that sit and hang.
                                                  	# 0 means the fake result stays fully occluded.

occlusion_query_fake_upper_threshold = 100        	# Upper end of the fake sample count value written on EVENT_WRITE_ZPD when real occlusion queries are disabled.
                                                  	# Keep this higher than occlusion_query_fake_lower_threshold.
                                                  	# Ignored if occlusion_query_fake_lower_threshold is -1.

occlusion_query_querybatch_range = 0              	# Range of fake sample count values to walk for titles using the D3D QueryBatch standard before wrapping back to occlusion_query_fake_lower_threshold.
                                                  	# This shouldn't be changed from the default value of 0 (disabled) unless necessary for a specific title.

occlusion_query_saturation = 1                    	# Compress higher occlusion query sample counts before guest writeback.
                                                  	# This can be useful if effects such as lens flares appear too strong.
                                                  	# 1.0 = default behavior
                                                  	# 0.0 = collapse all nonzero sample counts to 1
                                                  	# Values around 0.90 are a good starting point for subtle tuning.

primitive_processor_cache_min_indices = 4096      	# Smallest number of guest indices to store in the cache to try reusing later in the same frame if processing (such as primitive type conversion or reset index replacement) is performed.
                                                  	# Setting this to a very high value may result in excessive CPU processing, while a very low value may result in excessive locking and lookups.
                                                  	# Negative values disable caching.

readback_memexport = false                        	# Read data written by memory export in shaders on the CPU. This may be needed in some games (but many only access exported data on the GPU, and this flag isn't needed to handle such behavior), but causes mid-frame synchronization, so it has a huge performance impact.
readback_resolve = "deferred"                     	# Controls CPU readback of render-to-texture resolve results.
                                                  	#  fast: Readback delivered to guest RAM at GPU->CPU sync points (fence writes, primary buffer end, swap), batching the GPU stall across all resolves since the last sync - correct and much faster than full
                                                  	#  full: Stall the GPU and copy on every resolve (accurate but slow; use only if a game reads resolves without a sync point fast misses)
                                                  	#  deferred: Like fast, but instead of stalling the command processor at each fence to deliver the readback, the fence value the guest polls is itself deferred until the readback's GPU work finishes on its own - the guest still never observes the fence before its data is in RAM, but the GPU is no longer drained to idle at every fence. Highest framerate for games that read many small resolves on the CPU (e.g. Fable II morphs at high resolution scale); D3D12 only (Vulkan falls back to fast)
                                                  	#  none: Disable readback completely (some games render better without it)

readback_resolve_8888_only = false                	# When CPU readback of render-to-texture resolves is enabled (readback_resolve is not "none"), only read back k_8_8_8_8 color resolves. This is one of the formats Fable II uses for texture morphs that need CPU data; restricting to it avoids the cost of reading back resolves in other formats that the game never reads on the CPU. NOTE: this excludes Fable II's k_1_5_5_5 character-body morphs - prefer readback_resolve_morph_formats_only for Fable II. Leave off if another game needs a different resolved format on the CPU.
readback_resolve_deferred_lazy = true             	# In "deferred" readback mode, never block the command processor at primary-buffer-end or swap to deliver resolve readbacks. Readbacks recorded since the last guest fence are instead attached to a valueless deferred fence and delivered when their GPU submission completes on its own, like fence-gated readbacks already are. The guest still never observes a fence value before the readback data is in RAM (correctness unchanged); the emulator just stops waiting for the GPU eagerly, keeping CPU/GPU overlap - measured as the dominant remaining readback stall in Fable II at high resolution scale. The command-processor-idle path stays blocking, so a guest busy-waiting on a fence always makes progress. Try true for more performance; if morph textures go stale/black, set back to false. Only affects readback_resolve = "deferred" on Direct3D 12.
readback_resolve_downsample_via_scratch = true    	# At resolution scales above 1x, write the CPU-readback downsample of a resolve into the command processor's scratch GPU buffer instead of the 512 MB shared-memory buffer (Lever C). The readback copy then reads the scratch buffer, so shared memory is no longer transitioned UAV<->COPY_SOURCE around every readback resolve (roughly ten times a frame in Fable II, serialized against every draw that binds shared memory) and no longer needs a sparse commit of the destination range. The downsample output exists only for the CPU; the GPU reads the scaled resolve data directly, so skipping the shared-memory write is safe. If morph textures break with this on, set it back to false. No effect at 1x or when readback is disabled.
readback_resolve_drain_on_fence = true            	# Deliver deferred resolve readbacks to guest RAM at every GPU fence write (EVENT_WRITE), in addition to primary-buffer end and swap. This is the safe default: the guest cannot observe a fence (and thus cannot read the resolved data) until the readback has landed. Setting this false drains ONLY at primary-buffer end and swap, which means far fewer GPU sync stalls (higher framerate) but risks stale/black readback if a game reads resolved data mid-command-buffer right after a fence. Try false for more performance; if morph textures flicker or go black, set it back to true.
readback_resolve_max_length = 1048576             	# When CPU readback of render-to-texture resolves is enabled (readback_resolve is not "none"), skip reading back any color resolve whose destination is larger than this many bytes (0 = no limit). Games that read resolves on the CPU only do so for small textures (e.g. Fable II's character/dog morph textures); large full-screen resolves (the scene, shadows, post-processing) are never read by the CPU, so reading them back is pure cost - it copies megabytes per frame and, worse, keeps a readback pending at almost every fence, forcing a GPU sync stall at each. Capping the size leaves only the small CPU-read resolves pending, so most fences stall-free. Use log_resolve_readback to find the size of the textures a game actually needs, then set this just above it (e.g. 2097152 for 2 MiB). Too low and a needed readback is skipped (its texture goes stale/black).
readback_resolve_morph_formats_only = true        	# When CPU readback of render-to-texture resolves is enabled (readback_resolve is not "none"), only read back resolves whose destination format is k_8_8_8_8 or k_1_5_5_5 - the two formats Fable II's CPU texture morphs (dog = k_8_8_8_8, character body = k_1_5_5_5) use. The game renders many other resolves (k_2_10_10_10, k_16_16_16_16_FLOAT, etc.) that the CPU never reads; reading them back is pure cost - a copy plus a GPU sync stall at the next fence. Restricting to the morph formats skips the majority of readbacks (in a Fable II capture ~57% were non-morph formats). Leave off for other games unless you know their CPU-read resolve format. Combine with readback_resolve_max_length to also drop full-screen k_8_8_8_8 resolves that aren't morphs.
readback_resolve_only_dest_bases = "0x12700000-0x127fffff"	# When CPU readback of render-to-texture resolves is enabled (readback_resolve is not "none"), only read back resolves whose RB_COPY_DEST_BASE (the guest destination base address of the resolve) matches one of these comma-separated entries - each a single address or an inclusive lo-hi range (hex with 0x or decimal, e.g. "0x12700000-0x127fffff,0x12d00000-0x12dfffff"); empty = no restriction. This is the most aggressive readback filter and the one that recovers the most framerate: Fable II resolves the CPU-read morph textures to a small set of fixed base addresses, so matching only those reads back about one resolve per frame instead of the ten-to-forty the format and size filters still pass - the remaining readback stall is the game blocking on each resolve fence, so cutting their count is what closes it (this is how the Fable II femtofork gets its higher framerate; it uses a single address, 0x12704000, but that only covers the character morph - the dog resolves to a different base, so list both). AND-combined with the other readback filters, so when set it dominates. Game- and version-specific: if a morph goes black or stops updating, its base is not in the list - find it with log_resolve_readback (the dest_base= field) or clear this. Leave empty for other games.
render_target_path_d3d12 = "rtv"                  	# Render target emulation path to use on Direct3D 12.
                                                  	# Use: [any, rtv, rov]
                                                  	#  rtv:
                                                  	#   Host render targets and fixed-function blending and depth / stencil testing, copying between render targets when needed.
                                                  	#   Lower accuracy (limited pixel format support).
                                                  	#   Performance limited primarily by render target layout changes requiring copying, but generally higher.
                                                  	#  rov:
                                                  	#   Manual pixel packing, blending and depth / stencil testing, with free render target layout changes.
                                                  	#   Requires a GPU supporting rasterizer-ordered views.
                                                  	#   Highest accuracy (all pixel formats handled in software).
                                                  	#   Performance limited primarily by overdraw.
                                                  	#   On AMD drivers, currently causes shader compiler crashes in many cases.
                                                  	#  Any other value:
                                                  	#   Choose what is considered the most optimal for the system (currently always RTV because the ROV path is much slower now, except for Intel GPUs, which have a bug in stencil testing that causes Xbox 360 Direct3D 9 clears not to work).

render_target_path_vulkan = ""                    	# Render target emulation path to use on Vulkan.
                                                  	# Use: [any, fbo, fsi]
                                                  	#  fbo:
                                                  	#   Host framebuffers and fixed-function blending and depth / stencil testing, copying between render targets when needed.
                                                  	#   Lower accuracy (limited pixel format support).
                                                  	#   Performance limited primarily by render target layout changes requiring copying, but generally higher.
                                                  	#  fsi:
                                                  	#   Manual pixel packing, blending and depth / stencil testing, with free render target layout changes.
                                                  	#   Requires a GPU supporting fragment shader interlock.
                                                  	#   Highest accuracy (all pixel formats handled in software).
                                                  	#   Performance limited primarily by overdraw.
                                                  	#  Any other value:
                                                  	#   Choose what is considered the most optimal for the system (currently always FB because the FSI path is much slower now).

resolve_check_number_format = false               	# Require the destination number format to match before using fast color resolves.
                                                  	# Fast resolves copy the exact EDRAM bits. If a title resolves unsigned color data to a signed or integer destination, enabling this forces full resolves in the shader so the destination gets repacked instead.
                                                  	# This can fix some garbage shading stemming from format mismatches, but it's disabled by default because it can worsen performance in some games that realistically don't need it.

resolve_resolution_scale_fill_half_pixel_offset = true	# When using resolution scaling, apply the hack that stretches the first surely covered host pixel in the left and top sides of render target resolve areas to eliminate the gap caused by the half-pixel offset (this is necessary for certain games to display the scene graphics).
skip_nonfinite_draws = false                      	# Skip drawing a (non-memexport) mesh whose guest vertex data contains a non-finite (NaN/Inf) value, so geometry fed bad CPU-supplied transform data vanishes for that frame instead of exploding across the screen (e.g. Fable II's dog). Mitigation only - does not fix the underlying bad data. Off by default.
skip_vs_hash_if_nonfinite = ""                    	# Skip a draw whose vertex shader ucode hash matches this 16-hex-digit value (comma-separated list) ONLY on frames where its guest vertex data is garbage (non-finite or absurdly huge). Unlike skip_nonfinite_draws this also applies to memexport shaders and is scoped to the listed hashes, so the draw renders normally when its data is good and only vanishes on the bad frames instead of exploding - e.g. Fable II's redundant dog draw 7C5710DEF3EE33C4, whose skinned positions come out huge-finite on ~15% of frames and every area change.
snorm16_render_target_full_range = true           	# When the host can only support 16_16 and 16_16_16_16 render targets as -1...1, remap -32...32 to -1...1 to use the full possible range of values, at the expense of multiplicative blending correctness.
store_shaders = true                              	# Store shaders persistently and load them when loading games to avoid runtime spikes and freezes when playing the game not for the first time.
target_trace_file = ""                            	# Specifies the trace file to load.
texture_cache_memory_limit_hard = 768             	# Maximum host texture memory usage (in megabytes) above which textures will be destroyed as soon as possible.
texture_cache_memory_limit_render_to_texture = 192	# Part of the host texture memory budget (in megabytes) that will be scaled by the current drawing resolution scale.
                                                  	# If texture_cache_memory_limit_soft, for instance, is 384, and this is 64, it will be assumed that the game will be using roughly 64 MB of render-to-texture (resolve) targets and 384 - 64 = 320 MB of regular textures - so with 2x2 resolution scaling, the soft limit will be 320 + 256 MB, and with 3x3, it will be 320 + 576 MB.
                                                  	# This only adds cache headroom at resolution scales above 1x (the scaled add term is multiplied by scale_area - 1, so it is 0 at 1x and leaves 1x behavior unchanged); raising it reduces texture eviction/reload churn that can cause flickering when the camera moves at higher scales, at the cost of more video memory. Lower it if a high resolution scale runs out of video memory.

texture_cache_memory_limit_soft = 384             	# Maximum host texture memory usage (in megabytes) above which old textures will be destroyed.
texture_cache_memory_limit_soft_lifetime = 30     	# Seconds a texture should be unused to be considered old enough to be deleted if texture memory usage exceeds texture_cache_memory_limit_soft.
tiled_shared_memory = true                        	# Enable tiled/sparse resources for efficient large address space support. Disable for graphics debugger compatibility.
trace_dump_path = ""                              	# Output path for dumped files.
trace_gpu_prefix = "scratch/gpu/"                 	# Prefix path for GPU trace files.
trace_gpu_stream = false                          	# Trace all GPU packets.
trace_nonfinite_matrix_writer = false             	# Diagnostic: when a draw is found with non-finite (Inf/NaN) float vertex/transform data, watch that memory page and, on the next guest CPU write to it, log the writing guest thread's link register and PowerPC call stack. Used to find the game code that computes the bad (Inf) bone matrices that explode Fable II's dog. Very verbose; for debugging only. Off by default.
use_fuzzy_alpha_epsilon = false                   	# Use approximate compare for alpha values to prevent flickering on NVIDIA graphics cards
vsync = true                                      	# Enable VSYNC.


[General]
allow_game_relative_writes = false                	# Not useful to non-developers. Allows code to write to paths relative to game://. Used for generating test data to compare with original hardware. 
allow_plugins = false                             	# Allows loading of plugins/trainers from plugins\title_id\plugin.xex. Plugin are homebrew xex modules which can be used for making mods. This feature is experimental.
apply_patches = true                              	# Enables custom patching functionality
controller_hotkeys = false                        	# Hotkeys for Xbox and PS controllers.
debug = false                                     	# Allow debugging and retain debug information.
disable_doubleclick_fullscreen = false            	# Allows the user to disable the behavior where a fast double-click causes Xenia to enter fullscreen mode.
discord = true                                    	# Enable Discord rich presence
launch_module = ""                                	# Executable to launch from the .iso or the package instead of default.xex or the module specified by the game. Leave blank to launch the default module.
notification_sound_path = ""                      	# Path (including filename) to selected notification sound. Sound MUST be in wav format!
priority_class = 0                                	# Forces Xenia to use different process priority than default one. It might affect performance and cause unexpected bugs. Possible values: 0 - Normal, 1 - Above normal, 2 - High
recent_titles_entry_amount = 10                   	# Allows user to define how many titles is saved in list of recently played titles.
time_scalar = 1                                   	# Scalar used to speed or slow time (1x, 2x, 1/2x, etc).


[HACKS]
ac6_ground_fix = false                            	# This fixes(hide) issues with black ground in AC6. Use only in AC6. Might cause issues in other titles.


