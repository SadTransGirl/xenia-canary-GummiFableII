name: Bug report
description: Report a problem with the GummiFableII Fable II build
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Before you file, please:**
        - 🔎 Search [existing issues](https://github.com/SadTransGirl/xenia-canary-GummiFableII/issues?q=is%3Aissue) — it may already be reported.
        - 📖 Check the [README Setup + Troubleshooting](https://github.com/SadTransGirl/xenia-canary-GummiFableII#troubleshooting) — flicker, hitching, crowd slowdown, and dog issues are covered there.

        This build is **Fable II–specific**, so Fable II bugs are welcome here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: I've read the README Setup + Troubleshooting.
          required: true
        - label: I'm using my own legally-owned copy of Fable II. (No piracy — do not ask for game files.)
          required: true
  - type: dropdown
    id: config
    attributes:
      label: Which config are you using?
      options:
        - Default (2× + CAS)
        - x1-fsr (native 720p + FSR)
        - low-end-cpu (any variant)
        - Custom / modified
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game version
      placeholder: e.g. GOTY (no TU1)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's going wrong?
      description: One or two sentences. Where and when does it happen (specific area/action, or "always")?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: e.g. Ryzen 5 5600
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: e.g. RTX 3060
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: RAM
      placeholder: e.g. 16 GB
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: e.g. switched configs, deleted cache_host, verified the game dump…
  - type: textarea
    id: media
    attributes:
      label: Screenshot / clip
      description: Drag an image or video in here if the issue is visual.
  - type: textarea
    id: logfile
    attributes:
      label: Log file
      description: If it's a crash/freeze, attach `xenia.log` from next to the exe.
